# v12 fieldfix — 현업 FP 4증상 대응.
#   1) spike 2~3개도 불량      -> normal_variants.few_spike
#   2) 가운데 avg 변동도 불량  -> 미해결 (렌더러 판정구간 표시 필요, LR flip 실험 후)
#   3) 타 eqp 동반 불량        -> normal_variants.common_mode
#   4) 계측 모수 적으면 불량   -> episode.sparse_chart (전 클래스 공통)
#   + 이웃보다 산포 큰 정상    -> normal_variants.loose_target
# 불량 강도는 하한을 올려 약한 불량이 경계를 normal 쪽으로 끌어당기지 않게 했다.
# v11 대비 변경점만 보려면: diff dataset.yaml configs/datasets/dataset_v12_fieldfix.yaml

seed: 42
episode:
  count_range:
  - 12
  - 25
  length_range:
  - 20
  - 45
  time_offset_range:
  - 0
  - 300
  missing:
    length_range:
    - 8
    - 100
    max_count: 3
  # 계측 모수가 적은 chart. 클래스와 무관하게 적용한다 —
  # normal 에만 걸면 '점이 적다 = 정상' 이라는 새 지름길이 생긴다.
  sparse_chart:
    prob: 0.15
    keep_ratio_range:
    - 0.12
    - 0.35
    min_points: 10
  member_variation:
    event_count_range:
    - 0
    - 3
    event_length_range:
    - 5
    - 25
    event_weights:
      dropout: 0.3
      thin: 0.4
      densify: 0.3
  region_weights:
    dense: 0.28
    sparse: 0.32
    very_sparse: 0.18
    thin: 0.12
    missing: 0.1
  region:
    dense:
      density_range:
      - 0.7
      - 1.0
    sparse:
      density_range:
      - 0.4
      - 0.7
    very_sparse:
      density_range:
      - 0.2
      - 0.35
    thin:
      density_range:
      - 0.1
      - 0.2
    missing:
      density: 0.0
  noise:
    gaussian:
      sigma_range:
      - 0.03
      - 0.065
    laplacian:
      b_range:
      - 0.012
      - 0.03
    correlated:
      rho_range:
      - 0.0
      - 0.2
      sigma_range:
      - 0.003
      - 0.008
baseline:
  value_range:
  - -0.3
  - 0.3
  random_walk_step:
  - 0.0005
  - 0.0015
  mean_revert_range:
  - 0.2
  - 0.4
  center_spread: 0.8
chart:
  device:
    ids:
    - DEV_A
    - DEV_B
    - DEV_C
    - DEV_D
    - DEV_E
  step:
    ids:
    - S01
    - S02
    - S03
    - S04
    - S05
  item:
    ids:
    - CD1
    - CD2
    - CD3
    - THK1
    - THK2
    - OVL1
    - OVL2
    - DEF1
context:
  columns:
  - eqp_id
  - chamber
  - recipe
  eqp_id:
    ids:
    - EQP_01
    - EQP_02
    - EQP_03
    - EQP_04
    - EQP_05
    - EQP_06
    - EQP_07
    - EQP_08
    count_range:
    - 4
    - 7
  chamber:
    ids:
    - CH_A
    - CH_B
    - CH_C
    - CH_D
    - CH_E
    count_range:
    - 4
    - 5
  recipe:
    ids:
    - RCP_X1
    - RCP_X2
    - RCP_X3
    - RCP_X4
    - RCP_X5
    - RCP_X6
    count_range:
    - 4
    - 6
  fleet_variation:
    mean_range:
    - 0.0005
    - 0.003
    std_range:
    - 0.003
    - 0.007
  target_deviation:
    mean_reference: between
    mean_sigma_range:
    - 2.0
    - 3.2
    mean_min_within_ratio: 1.8
    std_reference: within
    std_sigma_range:
    - 2.0
    - 3.2
    std_range:
    - 2.0
    - 3.2
    std_min_scale: 1.25
    min_mean_nsigma: 2.0
    min_std_nsigma: 2.0
normal_variants:
  # 정상 클래스 하위 유형 비율. clean 만 있으면 v11 과 동일 동작.
  weights:
    clean: 0.55
    few_spike: 0.20
    common_mode: 0.15
    loose_target: 0.10
  few_spike:
    # 불량 spike 는 min_spikes 10개 / 5.0 sigma 이상 -> 개수·크기로 분리된다
    count_range:
    - 1
    - 4
    magnitude_sigma_range:
    - 2.0
    - 3.0
  common_mode:
    kind_weights:
      spike: 0.6
      shift: 0.4
    spike_count_range:
    - 3
    - 12
    spike_magnitude_sigma_range:
    - 3.0
    - 6.0
    shift_sigma_range:
    - 1.0
    - 2.0
    shift_start_ratio_range:
    - 0.45
    - 0.8
  loose_target:
    # 전 구간 균일하게 넓힘. std 불량은 '우측이 자기 좌측보다 넓다' 로
    # 판별되므로 (std_floor_ratio) 겹치지 않는다.
    std_scale_range:
    - 1.8
    - 3.0
defect:
  region_ratio_range:
  - 0.14
  - 0.3
  mean_shift:
    shift_sigma_range:
    - 1.4
    - 2.2
    difficulty_scale_floor: 0.9
  standard_deviation:
    scale_range:
    - 1.6
    - 2.4
  spike:
    magnitude_sigma_range:
    - 5.0
    - 8.0
    difficulty_scale_floor: 0.9
    spike_ratio_range:
    - 0.12
    - 0.28
    min_spikes: 10
    min_magnitude_sigma: 5.0
    region_ratio_range:
    - 0.12
    - 0.18
  drift:
    slope_sigma_range:
    - 0.6
    - 1.8
    region_ratio_range:
    - 0.2
    - 0.375
    visible_span_ratio_range:
    - 0.12
    - 0.18
    min_max_drift_sigma: 1.6
    visual_floor_sigma: 2.0
    max_range_scale: 0.7
    drift_method: index
  enforcement:
    mean_shift_floor_sigma: 1.8
    mean_shift_self_floor_sigma: 1.4
    std_floor_ratio: 2.2
    spike_floor_sigma: 9.0
    drift_floor_sigma: 1.9
    context_floor_sigma: 2.6
    normal_max_right_dev_sigma: 0.5
    normal_max_right_shift_sigma: 0.5
    min_defect_points_range:
    - 12
    - 25
image:
  width: 224
  height: 224
  dpi: 100
  background: white
  outlier_sigma: 5
  baseline_line: true
  overlay:
    fleet_color: '#B0B0B0'
    fleet_alpha: 0.4
    fleet_marker_size: 14
    target_color: '#4878CF'
    target_alpha: 0.75
    target_marker_size: 16
  title_columns:
  - device
  - step
  - item
  x_label: null
  y_label: Measurement Value (nm)
dataset:
  version: v12_fieldfix
  samples_per_class:
    mean_shift: 1000
    standard_deviation: 1000
    spike: 1000
    drift: 1000
    context: 1000
    normal: 5000
  classes:
  - mean_shift
  - standard_deviation
  - spike
  - drift
  - context
  - normal
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  test_difficulty_scale: 0.8
  val_difficulty_scale: 0.8
output:
  data_dir: data_v12_fieldfix
  image_dir: images_v12_fieldfix
  display_dir: display_v12_fieldfix
