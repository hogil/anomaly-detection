# v12 n12k — 현업 FP 대응. normal 12000 / sparse 0.35 / noise +40%.
# 설정을 바꾸면 반드시 output 폴더명도 함께 바꿀 것 —
# 폴더가 이미 있으면 생성을 건너뛰므로 옛 데이터로 학습된다.
#   1) spike 2~3개도 불량      -> normal_variants.few_spike
#   2) 가운데 avg 변동도 불량  -> 미해결 (렌더러 판정구간 표시 필요, LR flip 실험 후)
#   3) 타 eqp 동반 불량        -> normal_variants.common_mode
#   4) 계측 모수 적으면 불량   -> episode.sparse_chart (전 클래스 공통)
#   + 이웃보다 산포 큰 정상    -> normal_variants.loose_target
# 불량 강도는 하한을 올려 약한 불량이 경계를 normal 쪽으로 끌어당기지 않게 했다.
# v11 대비 변경점만 보려면: diff dataset.yaml configs/datasets/dataset_v13.yaml

seed: 42
episode:
  count_range:
  - 12
  - 25
  length_range:
  - 20
  - 45
  time_offset_range:
  - 0
  - 300
  missing:
    length_range:
    - 8
    - 100
    max_count: 3
  # 계측 모수 축소. 클래스와 무관하게 적용한다 —
  # normal 에만 걸면 '점이 적다 = 정상' 이라는 새 지름길이 생긴다.
  sparse_chart:
    prob: 0.35
    # mode=member: 특정 설비(레전드) 하나만 성긴 경우 — 현업에서 흔하다
    mode_weights:
      chart: 0.45
      member: 0.55
    member_frac_range:
    - 0.15
    - 0.4
    target_prob: 0.6
    keep_ratio_range:
    - 0.05
    - 0.28
    min_points: 8
    # 불량 클래스: 불량 구간에 이만큼은 남겨야 한다. 점 3개짜리 불량은
    # 판정 근거가 못 되므로 keep 을 위로 올리거나 성기게 만들지 않는다.
    min_defect_points: 8
    defect_region_ratio: 0.12
  member_variation:
    event_count_range:
    - 0
    - 3
    event_length_range:
    - 5
    - 25
    event_weights:
      dropout: 0.3
      thin: 0.4
      densify: 0.3
  region_weights:
    dense: 0.28
    sparse: 0.32
    very_sparse: 0.18
    thin: 0.12
    missing: 0.1
  region:
    dense:
      density_range:
      - 0.7
      - 1.0
    sparse:
      density_range:
      - 0.4
      - 0.7
    very_sparse:
      density_range:
      - 0.2
      - 0.35
    thin:
      density_range:
      - 0.1
      - 0.2
    missing:
      density: 0.0
  noise:
    gaussian:
      sigma_range:
      - 0.042
      - 0.091
    laplacian:
      b_range:
      - 0.017
      - 0.042
    correlated:
      rho_range:
      - 0.0
      - 0.25
      sigma_range:
      - 0.0042
      - 0.0112
baseline:
  value_range:
  - -0.3
  - 0.3
  random_walk_step:
  - 0.0005
  - 0.0015
  mean_revert_range:
  - 0.2
  - 0.4
  center_spread: 0.8
chart:
  device:
    ids:
    - DEV_A
    - DEV_B
    - DEV_C
    - DEV_D
    - DEV_E
  step:
    ids:
    - S01
    - S02
    - S03
    - S04
    - S05
  item:
    ids:
    - CD1
    - CD2
    - CD3
    - THK1
    - THK2
    - OVL1
    - OVL2
    - DEF1
context:
  columns:
  - eqp_id
  - chamber
  - recipe
  eqp_id:
    ids:
    - EQP_01
    - EQP_02
    - EQP_03
    - EQP_04
    - EQP_05
    - EQP_06
    - EQP_07
    - EQP_08
    count_range:
    - 4
    - 7
  chamber:
    ids:
    - CH_A
    - CH_B
    - CH_C
    - CH_D
    - CH_E
    count_range:
    - 4
    - 5
  recipe:
    ids:
    - RCP_X1
    - RCP_X2
    - RCP_X3
    - RCP_X4
    - RCP_X5
    - RCP_X6
    count_range:
    - 4
    - 6
  fleet_variation:
    mean_range:
    - 0.0005
    - 0.003
    std_range:
    - 0.003
    - 0.007
  target_deviation:
    mean_reference: between
    mean_sigma_range:
    - 2.0
    - 3.2
    mean_min_within_ratio: 1.8
    std_reference: within
    std_sigma_range:
    - 2.0
    - 3.2
    std_range:
    - 2.0
    - 3.2
    std_min_scale: 1.8
    min_mean_nsigma: 2.0
    min_std_nsigma: 2.0
normal_variants:
  # 정상 클래스 하위 유형 비율. clean 만 있으면 v11 과 동일 동작.
  weights:
    clean: 0.18
    recovered: 0.26
    mid_shift: 0.20
    few_spike: 0.18
    loose_target: 0.18
    common_mode: 0.0
  recovered:
    # 중간에서 이상이 났다가 되돌아온 정상 (PM 후 회복 등).
    # 진폭은 진짜 불량과 같은 설정을 쓴다 — 약하게 넣으면 모델이 '작으면 정상'을
    # 배울 뿐 복귀 여부를 안 본다. 우측 끝이 깨끗한지만으로 갈려야 한다.
    kind_weights:
      mean_shift: 0.3
      standard_deviation: 0.25
      drift: 0.25
      spike: 0.2
    start_ratio_range:
    - 0.15
    - 0.42
    span_ratio_range:
    - 0.12
    - 0.26
    max_end_ratio: 0.65      # 복귀 구간을 최소 35% 확보
    min_points: 8
    min_recovery_points: 12
  mid_shift:
    # 불량 mean_shift 는 우측 끝 14~30% 구간. 여기는 25~55% 지점에서 바뀌고
    # 그대로 유지되므로 '바뀐 뒤 안정 구간 길이' 가 구분 신호가 된다.
    start_ratio_range:
    - 0.25
    - 0.55
    shift_sigma_range:
    - 1.0
    - 2.5
    min_side_points: 5
    # 뒤쪽이 길면 전체 평균이 통째로 밀려 context(mean) 불량처럼 보인다.
    # context 하한(mean_min_within_ratio 1.8) 아래로 유지.
    max_mean_offset_sigma: 1.5
  few_spike:
    # 판별 기준은 '크기'가 아니라 '개수'다. 크기를 작게 두면 모델은
    # "작은 튐은 정상"만 배우고, 현업의 크고 개수 적은 2~3매는 계속 잡는다.
    # -> 불량 spike(5.0~8.0σ)와 같은 스케일로 두고 개수(1~3 vs 8+)로만 가른다.
    count_range:
    - 1
    - 3
    magnitude_sigma_range:
    - 5.0
    - 10.0
  loose_target:
    # 이웃보다 '조금' 넓은 정상. 월등히 넓은 것은 context 불량이 맡는다 —
    # context 하한이 fleet_visual_spread x 1.25 이므로 여기 상한은 1.0 으로 막는다.
    std_scale_range:
    - 1.2
    - 1.7
    max_visual_ratio: 1.5
  common_mode:
    # fleet 전원이 함께 움직이는 정상. 지금은 weight 0 (필요하면 올릴 것)
    kind_weights:
      spike: 0.6
      shift: 0.4
    spike_count_range:
    - 3
    - 12
    spike_magnitude_sigma_range:
    - 3.0
    - 6.0
    shift_sigma_range:
    - 1.0
    - 2.0
    shift_start_ratio_range:
    - 0.45
    - 0.8
defect:
  region_ratio_range:
  - 0.14
  - 0.3
  mean_shift:
    shift_sigma_range:
    - 1.9
    - 2.8
    difficulty_scale_floor: 0.9
  standard_deviation:
    scale_range:
    - 2.2
    - 3.2
  spike:
    magnitude_sigma_range:
    - 6.5
    - 10.0
    difficulty_scale_floor: 0.9
    spike_ratio_range:
    - 0.12
    - 0.28
    min_spikes: 14
    min_magnitude_sigma: 6.5
    region_ratio_range:
    - 0.12
    - 0.18
  drift:
    slope_sigma_range:
    - 1.2
    - 2.6
    region_ratio_range:
    - 0.2
    - 0.375
    visible_span_ratio_range:
    - 0.12
    - 0.18
    min_max_drift_sigma: 2.4
    visual_floor_sigma: 2.8
    max_range_scale: 0.7
    drift_method: index
  enforcement:
    mean_shift_floor_sigma: 2.2
    mean_shift_self_floor_sigma: 1.8
    std_floor_ratio: 2.8
    spike_floor_sigma: 11.0
    drift_floor_sigma: 2.6
    context_floor_sigma: 2.6
    normal_max_right_dev_sigma: 0.5
    normal_max_right_shift_sigma: 0.5
    min_defect_points_range:
    - 12
    - 25
image:
  width: 224
  height: 224
  dpi: 100
  background: white
  outlier_sigma: 5
  baseline_line: true
  overlay:
    fleet_color: '#B0B0B0'
    fleet_alpha: 0.4
    fleet_marker_size: 14
    target_color: '#4878CF'
    target_alpha: 0.75
    target_marker_size: 16
  title_columns:
  - device
  - step
  - item
  x_label: null
  y_label: Measurement Value (nm)
dataset:
  version: v13
  samples_per_class:
    mean_shift: 1000
    standard_deviation: 1000
    spike: 1000
    drift: 1000
    context: 1000
    normal: 12000
  classes:
  - mean_shift
  - standard_deviation
  - spike
  - drift
  - context
  - normal
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  test_difficulty_scale: 0.8
  val_difficulty_scale: 0.8
output:
  data_dir: data_v13
  image_dir: images_v13
  display_dir: display_v13
