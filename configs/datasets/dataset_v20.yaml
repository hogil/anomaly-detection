# v20 — early_stop 추가: target 이 왼쪽에만 있고 최근에 안 돌린 경우 정상.
# ---
# context avg 민감도 완화:
#   불량 하한 2.8 -> 3.6σ, 정상 context_like 0.8~2.0 -> 0.8~3.0σ (18%).
#   v18 에서 2.1~4.0σ 구간이 비어 있어 3σ 쯤 떨어진 정상이 여전히 잡혔다.
# ---
# 최대 오검 2건 커버리지:
#   (1) 우측 끝에만 데이터가 있는 설비  -> episode.late_start  prob 0.35
#   (2) 전체 설비가 2대뿐인 chart       -> episode.small_fleet prob 0.42 (2대 75%)
#   둘 다 클래스와 무관하게 적용한다 — 정상에만 걸면 새 지름길이 생긴다.
# ---
# v16 대비 late_start(우측 끝에서 뒤늦게 시작) 추가.
# ---
# v15 대비 context 완화:
#   context 불량 하한 상향 (avg 가 너무 민감했다) + normal 에 context_like 신설.
#   정상은 fleet 평균 0.6σ 이내로 강제되고 context 는 1.8σ 이상이라
#   그 사이가 비어 '조금만 치우쳐도 context 불량' 이 됐다.
# ---
# v14 대비 mean_shift(avg 변동) 하향:
#   2.4~3.4σ -> 1.8~2.8σ, floor 2.8 -> 2.1.
#   너무 크게 잡으면 중간 강도의 진짜 avg 불량을 정상으로 흘린다(FN).
#   정상 right_minor 상한 1.4σ 와는 그대로 분리된다.
# v20 — 현업 FP(정상을 불량으로 오검) 대응 데이터셋.
#
# 현업 오검 증상 -> 대응
#   spike 2~3개도 불량        -> normal_variants.few_spike (개수로만 판별)
#   가운데 avg 변동도 불량     -> normal_variants.mid_shift
#   났다가 되돌아온 것도 불량   -> normal_variants.recovered
#   우측 소량 변동도 불량      -> normal_variants.right_minor
#   계측 모수 적으면 불량      -> episode.sparse_chart (전 클래스 공통)
#   멤버 2대 중 하나가 불량    -> episode.small_fleet
#   멤버 1개인데 불량         -> episode.single_legend (정상 전용)
#   이웃보다 산포 크면 불량    -> normal_variants.loose_target
#
# 불량은 하한을 계속 올려 왔다 — 약한 불량이 경계를 normal 쪽으로 끌어당기기 때문.
# 설정을 바꾸면 dataset.version 과 output 폴더명을 함께 올릴 것
# (폴더가 이미 있으면 생성을 건너뛰므로 옛 데이터로 학습된다).

seed: 42
episode:
  count_range:
  - 12
  - 25
  length_range:
  - 20
  - 45
  time_offset_range:
  - 0
  - 300
  missing:
    length_range:
    - 8
    - 100
    max_count: 3
  # 계측 모수 축소. 클래스와 무관하게 적용한다 —
  # normal 에만 걸면 '점이 적다 = 정상' 이라는 새 지름길이 생긴다.
  # target 이 왼쪽에만 있고 최근(우측)에는 없는 chart — 최근에 안 돌린 설비.
  # 불량은 전부 우측 끝 구간에 들어가므로 그 구간에 점이 없으면 판정 대상이 아니다.
  # context(avg/std) 처럼 전 구간을 보는 것도 같은 규칙으로 정상 처리한다.
  # normal 전용 (fleet 은 전 구간 유지 -> '혼자만 최근에 안 돌았다' 가 드러난다).
  early_stop:
    prob: 0.18
    head_ratio_range:
    - 0.30
    - 0.80
    min_points: 5
  # 우측 끝에서 뒤늦게 시작한 chart. 2달치 중 최근 며칠만 진행 ->
  # 남은 점이 전부 불량 구간에 몰려 오검. scope 로 두 상황을 다 만든다.
  # 불량 클래스는 꼬리 점이 min_defect_points 미만이면 되돌린다.
  late_start:
    prob: 0.35
    # target 만 늦게 시작(다른 eqp 는 계속 진행) / 다 같이 늦게 시작 둘 다 만든다
    scope_weights:
      target: 0.55
      all: 0.45
    tail_ratio_range:
    - 0.03
    - 0.25
    min_points: 3
    min_defect_points: 10
  # 멤버 1개 — 비교 대상이 없으니 판정 불가 -> 정상. normal 에만 적용.
  single_legend:
    prob: 0.12
  # 멤버 2~3대 chart. 기본 count_range 최소가 4라 이런 그림이 아예 없었다.
  # "eqp 2대 중 한쪽 모수가 적으면 그쪽이 불량" 오검의 배경. 전 클래스 공통.
  small_fleet:
    # 현업에서 eqp 2대짜리가 계속 불량으로 나온다 -> 2대 비중을 높인다.
    # 멤버가 2대면 fleet 이 '밴드' 가 아니라 기준선 1개라 작은 차이도 크게 보인다.
    prob: 0.42
    count_weights:
      2: 0.75
      3: 0.25
  sparse_chart:
    prob: 0.35
    # mode=member: 특정 설비(레전드) 하나만 성긴 경우 — 현업에서 흔하다
    mode_weights:
      chart: 0.45
      member: 0.55
    member_frac_range:
    - 0.15
    - 0.4
    target_prob: 0.6
    keep_ratio_range:
    - 0.05
    - 0.28
    min_points: 8
    # 불량 클래스: 불량 구간에 이만큼은 남겨야 한다. 점 3개짜리 불량은
    # 판정 근거가 못 되므로 keep 을 위로 올리거나 성기게 만들지 않는다.
    min_defect_points: 10
    defect_region_ratio: 0.12
  member_variation:
    event_count_range:
    - 0
    - 3
    event_length_range:
    - 5
    - 25
    event_weights:
      dropout: 0.3
      thin: 0.4
      densify: 0.3
  region_weights:
    dense: 0.28
    sparse: 0.32
    very_sparse: 0.18
    thin: 0.12
    missing: 0.1
  region:
    dense:
      density_range:
      - 0.7
      - 1.0
    sparse:
      density_range:
      - 0.4
      - 0.7
    very_sparse:
      density_range:
      - 0.2
      - 0.35
    thin:
      density_range:
      - 0.1
      - 0.2
    missing:
      density: 0.0
  noise:
    gaussian:
      sigma_range:
      - 0.042
      - 0.091
    laplacian:
      b_range:
      - 0.017
      - 0.042
    correlated:
      rho_range:
      - 0.0
      - 0.25
      sigma_range:
      - 0.0042
      - 0.0112
baseline:
  value_range:
  - -0.3
  - 0.3
  random_walk_step:
  - 0.0005
  - 0.0015
  mean_revert_range:
  - 0.2
  - 0.4
  center_spread: 0.8
chart:
  device:
    ids:
    - DEV_A
    - DEV_B
    - DEV_C
    - DEV_D
    - DEV_E
  step:
    ids:
    - S01
    - S02
    - S03
    - S04
    - S05
  item:
    ids:
    - CD1
    - CD2
    - CD3
    - THK1
    - THK2
    - OVL1
    - OVL2
    - DEF1
context:
  columns:
  - eqp_id
  - chamber
  - recipe
  eqp_id:
    ids:
    - EQP_01
    - EQP_02
    - EQP_03
    - EQP_04
    - EQP_05
    - EQP_06
    - EQP_07
    - EQP_08
    count_range:
    - 4
    - 7
  chamber:
    ids:
    - CH_A
    - CH_B
    - CH_C
    - CH_D
    - CH_E
    count_range:
    - 4
    - 5
  recipe:
    ids:
    - RCP_X1
    - RCP_X2
    - RCP_X3
    - RCP_X4
    - RCP_X5
    - RCP_X6
    count_range:
    - 4
    - 6
  fleet_variation:
    mean_range:
    - 0.0005
    - 0.003
    std_range:
    - 0.003
    - 0.007
  target_deviation:
    mean_reference: between
    mean_sigma_range:
    - 3.6
    - 5.2
    mean_min_within_ratio: 3.6
    std_reference: within
    std_sigma_range:
    - 2.6
    - 4.0
    std_range:
    - 2.6
    - 4.0
    std_min_scale: 2.6
    min_mean_nsigma: 3.6
    min_std_nsigma: 2.6
normal_variants:
  # 정상 클래스 하위 유형 비율. clean 만 있으면 v11 과 동일 동작.
  weights:
    clean: 0.06
    recovered: 0.16
    mid_shift: 0.12
    right_minor: 0.16
    few_spike: 0.20
    context_like: 0.18
    loose_target: 0.12
    common_mode: 0.0
  context_like:
    # fleet 에서 '조금' 떨어진 정상. context 불량 하한(mean_min_within_ratio 2.8σ)의
    # max_ratio_of_floor 배 아래로 clamp 되므로 절대 겹치지 않는다.
    mean_offset_sigma_range:
    - 0.8
    - 3.0
    max_ratio_of_floor: 0.75
  right_minor:
    # 우측 끝 소량 변동. 불량 mean_shift 하한(2.8σ) 아래로 유지해 경계를 만든다.
    kind_weights:
      shift: 0.6
      spread: 0.4
    start_ratio_range:
    - 0.72
    - 0.90
    shift_sigma_range:
    - 0.6
    - 1.4
    spread_scale_range:
    - 1.2
    - 1.7
    min_points: 5
  recovered:
    # 중간에서 이상이 났다가 되돌아온 정상 (PM 후 회복 등).
    # 진폭은 진짜 불량과 같은 설정을 쓴다 — 약하게 넣으면 모델이 '작으면 정상'을
    # 배울 뿐 복귀 여부를 안 본다. 우측 끝이 깨끗한지만으로 갈려야 한다.
    kind_weights:
      mean_shift: 0.3
      standard_deviation: 0.25
      drift: 0.25
      spike: 0.2
    start_ratio_range:
    - 0.15
    - 0.42
    span_ratio_range:
    - 0.12
    - 0.26
    max_end_ratio: 0.65      # 복귀 구간을 최소 35% 확보
    min_points: 8
    min_recovery_points: 12
  mid_shift:
    # 불량 mean_shift 는 우측 끝 14~30% 구간. 여기는 25~55% 지점에서 바뀌고
    # 그대로 유지되므로 '바뀐 뒤 안정 구간 길이' 가 구분 신호가 된다.
    start_ratio_range:
    - 0.25
    - 0.55
    shift_sigma_range:
    - 1.0
    - 2.5
    min_side_points: 5
    # 뒤쪽이 길면 전체 평균이 통째로 밀려 context(mean) 불량처럼 보인다.
    # context 하한(mean_min_within_ratio 1.8) 아래로 유지.
    max_mean_offset_sigma: 1.5
  few_spike:
    # 판별 기준은 '크기'가 아니라 '개수'다. 크기를 작게 두면 모델은
    # "작은 튐은 정상"만 배우고, 현업의 크고 개수 적은 2~3매는 계속 잡는다.
    # -> 불량 spike(5.0~8.0σ)와 같은 스케일로 두고 개수(1~3 vs 8+)로만 가른다.
    count_range:
    - 1
    - 5
    right_prob: 0.6
    right_start_ratio: 0.7
    magnitude_sigma_range:
    - 5.0
    - 10.0
  loose_target:
    # 이웃보다 '조금' 넓은 정상. 월등히 넓은 것은 context 불량이 맡는다 —
    # context 하한이 fleet_visual_spread x 1.25 이므로 여기 상한은 1.0 으로 막는다.
    std_scale_range:
    - 1.2
    - 1.7
    max_visual_ratio: 1.5
  common_mode:
    # fleet 전원이 함께 움직이는 정상. 지금은 weight 0 (필요하면 올릴 것)
    kind_weights:
      spike: 0.6
      shift: 0.4
    spike_count_range:
    - 3
    - 12
    spike_magnitude_sigma_range:
    - 3.0
    - 6.0
    shift_sigma_range:
    - 1.0
    - 2.0
    shift_start_ratio_range:
    - 0.45
    - 0.8
defect:
  region_ratio_range:
  - 0.14
  - 0.3
  mean_shift:
    shift_sigma_range:
    - 1.8
    - 2.8
    difficulty_scale_floor: 0.9
  standard_deviation:
    scale_range:
    - 2.8
    - 4.0
  spike:
    magnitude_sigma_range:
    - 8.0
    - 12.0
    difficulty_scale_floor: 0.9
    spike_ratio_range:
    - 0.12
    - 0.28
    min_spikes: 16
    min_magnitude_sigma: 8.0
    region_ratio_range:
    - 0.12
    - 0.18
  drift:
    slope_sigma_range:
    - 1.8
    - 3.2
    region_ratio_range:
    - 0.2
    - 0.375
    visible_span_ratio_range:
    - 0.12
    - 0.18
    min_max_drift_sigma: 3.0
    visual_floor_sigma: 3.4
    max_range_scale: 0.7
    drift_method: index
  enforcement:
    mean_shift_floor_sigma: 2.1
    mean_shift_self_floor_sigma: 1.7
    std_floor_ratio: 3.4
    spike_floor_sigma: 13.0
    drift_floor_sigma: 3.2
    context_floor_sigma: 4.8
    normal_max_right_dev_sigma: 0.5
    normal_max_right_shift_sigma: 0.5
    min_defect_points_range:
    - 12
    - 25
image:
  width: 224
  height: 224
  dpi: 100
  background: white
  outlier_sigma: 5
  baseline_line: true
  overlay:
    # 학습 이미지 전용 (display 는 자체 색상 상수를 쓴다).
    # target = 빨강, fleet = 아주 연한 회색.
    fleet_color: '#DEDEDE'
    fleet_alpha: 0.7
    fleet_marker_size: 14
    target_color: '#D62728'
    target_alpha: 0.85
    target_marker_size: 16
  title_columns:
  - device
  - step
  - item
  x_label: null
  y_label: Measurement Value (nm)
dataset:
  version: v20
  samples_per_class:
    mean_shift: 1000
    standard_deviation: 1000
    spike: 1000
    drift: 1000
    context: 1000
    normal: 16000
  classes:
  - mean_shift
  - standard_deviation
  - spike
  - drift
  - context
  - normal
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  test_difficulty_scale: 0.8
  val_difficulty_scale: 0.8
output:
  data_dir: data_v20
  image_dir: images_v20
  display_dir: display_v20
